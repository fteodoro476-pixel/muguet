name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust Toolchain
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install xcodegen and binaryen
        run: brew install xcodegen binaryen

      - name: Download game.wasm
        env:
          GH_TOKEN: ${{ secrets.MUGUET_PAT }}
        run: gh release download --repo fteodoro476-pixel/muguet-files --pattern game.wasm --dir .

      - name: Build iOS App
        run: |
          xcodebuild -version
          FREE=1 BUNDLE_ID=com.fteodoro.muguet ./make-ios.sh game.wasm --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/Muguet.ipa
          if-no-files-found: error
